# Checks that directory/kerno (the copy submitted to the Claude plugin directory)
# matches plugins/kerno. Fix with ./scripts/build-directory-plugin.sh.
name: Directory copy in sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: ./scripts/build-directory-plugin.sh
      - run: git status --porcelain && test -z "$(git status --porcelain)"
